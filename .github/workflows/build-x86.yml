name: Build x86_64

on:
  push:
    branches: [main, ci-test]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos.git
  REPO_BRANCH: istoreos-24.10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Free disk space
        uses: xiangfeidexiaohuo/actions@free-disk
        with:
          build-mount-path: ${{ github.workspace }}/openwrt

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo -E apt-get update -y
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libfuse-dev python3-setuptools g++ file clang nano genisoimage
          sudo -E apt-get clean
          git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
          df -h

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Add official feeds
        working-directory: openwrt
        run: |
          sed -i "1isrc-git 2h69k_oled https://github.com/jjm2473/luci-app-oled.git;master\n" feeds.conf.default
          sed -i "2isrc-git diskman https://github.com/jjm2473/luci-app-diskman.git;dev\n" feeds.conf.default
          sed -i "3isrc-git oaf https://github.com/jjm2473/OpenAppFilter.git;dev7\n" feeds.conf.default
          sed -i "4isrc-git jjm2473_apps https://github.com/jjm2473/openwrt-apps.git;main\n" feeds.conf.default
          sed -i "5isrc-git linkease_nas https://github.com/linkease/nas-packages.git;master\n" feeds.conf.default
          sed -i "6isrc-git linkease_nas_luci https://github.com/linkease/nas-packages-luci.git;main\n" feeds.conf.default
          sed -i "7isrc-git third_party https://github.com/linkease/istore-packages.git;main\n" feeds.conf.default

      - name: Update & Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add eqosplus
        working-directory: openwrt
        run: |
          git clone https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus

      - name: Configuration Customization
        working-directory: openwrt
        run: |
          cp $GITHUB_WORKSPACE/configs/x86.config .config
          make defconfig

      - name: Download package
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        working-directory: openwrt
        run: |
          date '+%Y%m%d%H' > version
          make -j$(nproc) V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@main
        with:
          name: x86_64-firmware
          path: openwrt/bin/targets/x86/64/*squashfs*img.gz
          if-no-files-found: error

      - name: Stage release file
        run: |
          mkdir -p $GITHUB_WORKSPACE/release
          cp openwrt/bin/targets/x86/64/istoreos-x86-64-generic-squashfs-combined.img.gz $GITHUB_WORKSPACE/release/

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=istoreos-x86-64-generic-squashfs-combined.img.gz
          N=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^iStoreOS-X86_64-' | grep -oE '[0-9]+$' | sort -n | tail -1)
          N=$((N+1))
          gh release create "iStoreOS-X86_64-$N" "$GITHUB_WORKSPACE/release/$f" --title "iStoreOS-X86_64-$N" --notes "iStoreOS 24.10 x86_64 固件 $(date '+%Y%m%d%H')"
