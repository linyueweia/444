name: Build x86_64

on:
  push:
    branches: [main, ci-test]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/istoreos/istoreos.git
  REPO_BRANCH: istoreos-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout configs
        uses: actions/checkout@v4

      - name: Clone iStoreOS source
        run: git clone --depth=1 $REPO_URL -b $REPO_BRANCH /opt/istoreos

      - name: Copy config
        run: cp $GITHUB_WORKSPACE/configs/x86.config /opt/istoreos/.config

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools python3-pip rsync swig unzip zlib1g-dev file wget
          sudo pip3 install pyelftools

      - name: Add extra feeds
        working-directory: /opt/istoreos
        run: |
          cat >> feeds.conf << 'FEEDEOF'
          src-git third_party https://github.com/linkease/istore-packages.git;main
          src-git diskman https://github.com/jjm2473/luci-app-diskman.git;dev
          src-git oaf https://github.com/jjm2473/OpenAppFilter.git;dev7
          src-git linkease_nas https://github.com/linkease/nas-packages.git;master
          src-git linkease_nas_luci https://github.com/linkease/nas-packages-luci.git;main
          src-git jjm2473_apps https://github.com/jjm2473/openwrt-apps.git;main
          FEEDEOF

      - name: Update and install feeds
        working-directory: /opt/istoreos
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Add eqosplus
        working-directory: /opt/istoreos
        run: git clone https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus

      - name: Configure
        working-directory: /opt/istoreos
        run: make defconfig

      - name: Download source
        working-directory: /opt/istoreos
        run: make -j$(nproc) download

      - name: Build
        working-directory: /opt/istoreos
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-firmware
          path: /opt/istoreos/bin/targets/x86/64/*squashfs*img.gz
          if-no-files-found: error
